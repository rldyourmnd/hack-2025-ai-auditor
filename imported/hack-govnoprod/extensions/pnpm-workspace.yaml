packages:
  - "packages/*"
  - "apps/*"

# Supply-chain controls for the retained pnpm workspaces.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: undici@6.29.1
  - undici@6.29.1
  # Renovate security update: happy-dom@21.0.0
  - happy-dom@21.0.0
  # Renovate security update: stream-json@3.6.0
  - stream-json@3.6.0
