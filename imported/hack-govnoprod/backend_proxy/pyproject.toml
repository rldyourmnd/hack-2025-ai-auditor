[tool.poetry]
name = "backend_proxy"
version = "0.1.0"
description = "API Gateway for extensions and frontends"
authors = ["dev <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.1"
sqlmodel = "1.0.3"
SQLAlchemy = {version = "2.1.0", extras = ["asyncio"]}
asyncpg = "0.27.0"
pydantic-settings = "1.2.0"
alembic = "1.11.1"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


