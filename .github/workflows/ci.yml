name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      timeout-minutes: 45
      fetch-depth: 0
      setup: true
      node-version: "24.21.0"
      python-version: "3.11"
      uv-version: "0.13.5"
      tools: zizmor@1.32.0
      tool-assets: .github/ci-tools.json
